services:
  - type: pserv
    name: osrm-service
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.osrm
    plan: starter
    envVars:
      - key: PORT
        value: 5000

  - type: web
    name: saarathi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OSRM_URL
        value: http://osrm-service:5000
      - key: PYTHON_VERSION
        value: 3.11.9
